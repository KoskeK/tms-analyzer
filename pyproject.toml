[project]
name = "tms-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KoskeK", email = "koske.kanasugi@truhla.eu" }
]
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "fastapi>=0.162.0",
    "flask-sqlalchemy>=3.1.1",
    "httpx>=0.28.1",
    "load-dotenv>=0.1.0",
    "mcstatus>=14.2.0",
    "playwright>=1.64.1",
    "sqlalchemy>=2.1.6",
    "tqdm>=4.70.1",
]

[project.scripts]
tms-analyzer = "tms_analyzer:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
